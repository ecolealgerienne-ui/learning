<svg width="1200" height="627" viewBox="0 0 1200 627" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <rect width="1200" height="627" fill="#0f1117"/>
  <rect width="1200" height="4" fill="#f59e0b"/>

  <text x="600" y="62" text-anchor="middle" fill="#ffffff" font-size="36" font-weight="800">Prompt Optimization</text>
  <text x="600" y="90" text-anchor="middle" fill="#64748b" font-size="16">−85% tokens. Same response quality. Measured in production.</text>

  <!-- BEFORE -->
  <rect x="60" y="112" width="510" height="380" rx="14" fill="#1a1d27"/>
  <rect x="60" y="112" width="510" height="44" rx="14" fill="#ef444418"/>
  <text x="315" y="140" text-anchor="middle" fill="#ef4444" font-size="15" font-weight="700">BEFORE — Naive prompt</text>

  <rect x="80" y="168" width="470" height="220" rx="8" fill="#0d1117" stroke="#334155" stroke-width="1"/>
  <text x="100" y="192" fill="#475569" font-size="11" font-weight="600">system_prompt.txt</text>
  <text x="100" y="212" fill="#94a3b8" font-size="12" font-family="monospace">You are an expert and professional banking</text>
  <text x="100" y="228" fill="#94a3b8" font-size="12" font-family="monospace">assistant. You must always respond in a</text>
  <text x="100" y="244" fill="#94a3b8" font-size="12" font-family="monospace">courteous and formal manner. You must also</text>
  <text x="100" y="260" fill="#94a3b8" font-size="12" font-family="monospace">verify that the user understands. Remember</text>
  <text x="100" y="276" fill="#94a3b8" font-size="12" font-family="monospace">to be precise and cite your sources. Always</text>
  <text x="100" y="292" fill="#94a3b8" font-size="12" font-family="monospace">stay within the regulatory framework...</text>
  <text x="100" y="324" fill="#475569" font-size="12" font-family="monospace">[600 more tokens of generic rules]</text>
  <text x="100" y="348" fill="#ef4444" font-size="12" font-family="monospace">→ Repeated 500,000×/month</text>
  <text x="100" y="368" fill="#ef4444" font-size="12" font-family="monospace">→ Cost: 800 tokens × $0.0035/1K = $1,400/mo</text>

  <!-- Token counter BEFORE -->
  <rect x="80" y="402" width="220" height="70" rx="8" fill="#ef444412" stroke="#ef444430" stroke-width="1"/>
  <text x="190" y="428" text-anchor="middle" fill="#64748b" font-size="12">Tokens / request</text>
  <text x="190" y="460" text-anchor="middle" fill="#ef4444" font-size="34" font-weight="800">847</text>

  <rect x="320" y="402" width="220" height="70" rx="8" fill="#ef444412" stroke="#ef444430" stroke-width="1"/>
  <text x="430" y="428" text-anchor="middle" fill="#64748b" font-size="12">Monthly cost</text>
  <text x="430" y="460" text-anchor="middle" fill="#ef4444" font-size="34" font-weight="800">$1,400</text>

  <!-- Arrow -->
  <text x="600" y="310" text-anchor="middle" fill="#6366f1" font-size="40" font-weight="800">→</text>
  <text x="600" y="342" text-anchor="middle" fill="#22c55e" font-size="14" font-weight="700">−85%</text>

  <!-- AFTER -->
  <rect x="630" y="112" width="510" height="380" rx="14" fill="#1a1d27"/>
  <rect x="630" y="112" width="510" height="44" rx="14" fill="#22c55e18"/>
  <text x="885" y="140" text-anchor="middle" fill="#22c55e" font-size="15" font-weight="700">AFTER — Surgical prompt</text>

  <rect x="650" y="168" width="470" height="220" rx="8" fill="#0d1117" stroke="#334155" stroke-width="1"/>
  <text x="670" y="192" fill="#475569" font-size="11" font-weight="600">system_prompt_v2.txt</text>
  <text x="670" y="212" fill="#22c55e" font-size="12" font-family="monospace">Banking expert. FR/EU regulatory scope.</text>
  <text x="670" y="228" fill="#22c55e" font-size="12" font-family="monospace">Factual responses. Citations required.</text>
  <text x="670" y="248" fill="#475569" font-size="12" font-family="monospace">— end —</text>
  <text x="670" y="290" fill="#64748b" font-size="12" font-family="monospace"># Observed result (Langfuse traces):</text>
  <text x="670" y="310" fill="#94a3b8" font-size="12" font-family="monospace">Quality score: 0.91 vs 0.89 before</text>
  <text x="670" y="330" fill="#94a3b8" font-size="12" font-family="monospace">Hallucinations: −12% (less noise)</text>
  <text x="670" y="350" fill="#22c55e" font-size="12" font-family="monospace">→ Equal or better quality!</text>

  <!-- Token counter AFTER -->
  <rect x="650" y="402" width="220" height="70" rx="8" fill="#22c55e12" stroke="#22c55e30" stroke-width="1"/>
  <text x="760" y="428" text-anchor="middle" fill="#64748b" font-size="12">Tokens / request</text>
  <text x="760" y="460" text-anchor="middle" fill="#22c55e" font-size="34" font-weight="800">127</text>

  <rect x="890" y="402" width="220" height="70" rx="8" fill="#22c55e12" stroke="#22c55e30" stroke-width="1"/>
  <text x="1000" y="428" text-anchor="middle" fill="#64748b" font-size="12">Monthly cost</text>
  <text x="1000" y="460" text-anchor="middle" fill="#22c55e" font-size="34" font-weight="800">$210</text>

  <!-- Bottom -->
  <rect x="200" y="516" width="800" height="50" rx="10" fill="#1a1d27" stroke="#334155" stroke-width="1"/>
  <text x="600" y="538" text-anchor="middle" fill="#f59e0b" font-size="14" font-weight="700">Lever #1: Prompt optimization → −$1,190/month. Effort: 2h. Tool: Langfuse Prompt Management.</text>
  <text x="600" y="558" text-anchor="middle" fill="#475569" font-size="13">Applied to 5 banking features → annual savings: $71,400</text>

  <text x="1160" y="618" text-anchor="end" fill="#334155" font-size="11">AI Architect · Regulated Environments</text>
</svg>
