  <text x="1040" y="152" text-anchor="middle" fill="#ef4444" font-size="11" font-weight="600">IMPACT</text>
  <text x="1040" y="172" text-anchor="middle" fill="#ef4444" font-size="18" font-weight="800">−30 à 50%</text>

