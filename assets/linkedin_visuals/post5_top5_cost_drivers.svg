  <text x="148" y="148" fill="#ffffff" font-size="16" font-weight="700">Prompt système trop lourd</text>
  <text x="148" y="172" fill="#64748b" font-size="13">Envoyé à CHAQUE requête. 800 tokens inutiles × 500K appels/mois = 450€ gaspillés. Sur UNE ligne.</text>
