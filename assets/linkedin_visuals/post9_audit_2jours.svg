<svg width="1200" height="627" viewBox="0 0 1200 627" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <rect width="1200" height="627" fill="#0f1117"/>
  <rect width="1200" height="4" fill="#22c55e"/>

  <text x="600" y="62" text-anchor="middle" fill="#ffffff" font-size="36" font-weight="800">The 2-Day AI Audit</text>
  <text x="600" y="90" text-anchor="middle" fill="#64748b" font-size="16">What I do when I arrive at a new bank — complete checklist</text>

  <!-- Day 1 -->
  <rect x="60" y="110" width="510" height="420" rx="14" fill="#1a1d27"/>
  <rect x="60" y="110" width="510" height="48" rx="14" fill="#6366f118"/>
  <text x="315" y="130" text-anchor="middle" fill="#6366f1" font-size="11" font-weight="700" letter-spacing="2">DAY 1 — DIAGNOSTIC</text>
  <text x="315" y="150" text-anchor="middle" fill="#94a3b8" font-size="14">Understand what exists</text>

  <text x="90" y="182" fill="#f59e0b" font-size="12" font-weight="700">09:00 — MORNING</text>

  <rect x="80" y="190" width="470" height="32" rx="6" fill="#252837"/>
  <text x="100" y="211" fill="#22c55e" font-size="13">✓</text>
  <text x="120" y="211" fill="#94a3b8" font-size="13">Inventory all LLM calls (grep + logs)</text>

  <rect x="80" y="228" width="470" height="32" rx="6" fill="#252837"/>
  <text x="100" y="249" fill="#22c55e" font-size="13">✓</text>
  <text x="120" y="249" fill="#94a3b8" font-size="13">Identify providers: OpenAI? Anthropic? Azure?</text>

  <rect x="80" y="266" width="470" height="32" rx="6" fill="#252837"/>
  <text x="100" y="287" fill="#22c55e" font-size="13">✓</text>
  <text x="120" y="287" fill="#94a3b8" font-size="13">Read last 3 months of invoices</text>

  <text x="90" y="322" fill="#f59e0b" font-size="12" font-weight="700">14:00 — AFTERNOON</text>

  <rect x="80" y="330" width="470" height="32" rx="6" fill="#252837"/>
  <text x="100" y="351" fill="#22c55e" font-size="13">✓</text>
  <text x="120" y="351" fill="#94a3b8" font-size="13">Analyze system prompts in production</text>

  <rect x="80" y="368" width="470" height="32" rx="6" fill="#252837"/>
  <text x="100" y="389" fill="#22c55e" font-size="13">✓</text>
  <text x="120" y="389" fill="#94a3b8" font-size="13">Test 50 typical requests — measure real tokens</text>

  <rect x="80" y="406" width="470" height="32" rx="6" fill="#252837"/>
  <text x="100" y="427" fill="#22c55e" font-size="13">✓</text>
  <text x="120" y="427" fill="#94a3b8" font-size="13">Check: is observability in place? (usually: no)</text>

  <rect x="80" y="452" width="470" height="60" rx="8" fill="#6366f112" stroke="#6366f130" stroke-width="1"/>
  <text x="315" y="475" text-anchor="middle" fill="#6366f1" font-size="12" font-weight="700">DAY 1 DELIVERABLE — 6:00 PM</text>
  <text x="315" y="497" text-anchor="middle" fill="#94a3b8" font-size="13">Diagnostic report: leaks identified + savings estimate</text>

  <!-- Day 2 -->
  <rect x="630" y="110" width="510" height="420" rx="14" fill="#1a1d27"/>
  <rect x="630" y="110" width="510" height="48" rx="14" fill="#22c55e18"/>
  <text x="885" y="130" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="700" letter-spacing="2">DAY 2 — QUICK WINS</text>
  <text x="885" y="150" text-anchor="middle" fill="#94a3b8" font-size="14">Fix what delivers ROI fastest</text>

  <text x="660" y="182" fill="#f59e0b" font-size="12" font-weight="700">09:00 — MORNING</text>

  <rect x="650" y="190" width="470" height="32" rx="6" fill="#252837"/>
  <text x="670" y="211" fill="#22c55e" font-size="13">✓</text>
  <text x="690" y="211" fill="#94a3b8" font-size="13">Install Langfuse (30 min, Docker Compose)</text>

  <rect x="650" y="228" width="470" height="32" rx="6" fill="#252837"/>
  <text x="670" y="249" fill="#22c55e" font-size="13">✓</text>
  <text x="690" y="249" fill="#94a3b8" font-size="13">Connect LiteLLM → traces active in 10 min</text>

  <rect x="650" y="266" width="470" height="32" rx="6" fill="#252837"/>
  <text x="670" y="287" fill="#22c55e" font-size="13">✓</text>
  <text x="690" y="287" fill="#94a3b8" font-size="13">Optimize the most expensive prompt (quick win)</text>

  <text x="660" y="322" fill="#f59e0b" font-size="12" font-weight="700">14:00 — AFTERNOON</text>

  <rect x="650" y="330" width="470" height="32" rx="6" fill="#252837"/>
  <text x="670" y="351" fill="#22c55e" font-size="13">✓</text>
  <text x="690" y="351" fill="#94a3b8" font-size="13">Set up budget alerts (LiteLLM guardrails)</text>

  <rect x="650" y="368" width="470" height="32" rx="6" fill="#252837"/>
  <text x="670" y="389" fill="#22c55e" font-size="13">✓</text>
  <text x="690" y="389" fill="#94a3b8" font-size="13">Langfuse dashboard: cost by feature, by team</text>

  <rect x="650" y="406" width="470" height="32" rx="6" fill="#252837"/>
  <text x="670" y="427" fill="#22c55e" font-size="13">✓</text>
  <text x="690" y="427" fill="#94a3b8" font-size="13">Present metrics to the engineering team</text>

  <rect x="650" y="452" width="470" height="60" rx="8" fill="#22c55e12" stroke="#22c55e30" stroke-width="1"/>
  <text x="885" y="475" text-anchor="middle" fill="#22c55e" font-size="12" font-weight="700">DAY 2 DELIVERABLE — 6:00 PM</text>
  <text x="885" y="497" text-anchor="middle" fill="#94a3b8" font-size="13">Live stack + 1st quick win measured + 30-day roadmap</text>

  <!-- Bottom stats -->
  <rect x="60" y="548" width="340" height="52" rx="10" fill="#1a1d27"/>
  <text x="230" y="568" text-anchor="middle" fill="#64748b" font-size="13">Average savings identified</text>
  <text x="230" y="592" text-anchor="middle" fill="#22c55e" font-size="22" font-weight="800">$8,000 – $25,000/month</text>

  <rect x="430" y="548" width="340" height="52" rx="10" fill="#1a1d27"/>
  <text x="600" y="568" text-anchor="middle" fill="#64748b" font-size="13">Daily audit rate</text>
  <text x="600" y="592" text-anchor="middle" fill="#f59e0b" font-size="22" font-weight="800">$1,500 – $2,500</text>

  <rect x="800" y="548" width="340" height="52" rx="10" fill="#1a1d27"/>
  <text x="970" y="568" text-anchor="middle" fill="#64748b" font-size="13">Client ROI on the sprint</text>
  <text x="970" y="592" text-anchor="middle" fill="#6366f1" font-size="22" font-weight="800">7x to 30x</text>

  <text x="1160" y="618" text-anchor="end" fill="#334155" font-size="11">AI Architect · Regulated Environments</text>
</svg>
