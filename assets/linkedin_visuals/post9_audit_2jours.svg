  <text x="600" y="592" text-anchor="middle" fill="#f59e0b" font-size="22" font-weight="800">1 500 – 2 500€ HT</text>

  <rect x="800" y="548" width="340" height="52" rx="10" fill="#1a1d27"/>
  <text x="970" y="568" text-anchor="middle" fill="#64748b" font-size="13">ROI client sur le sprint</text>
  <text x="970" y="592" text-anchor="middle" fill="#6366f1" font-size="22" font-weight="800">7x à 30x</text>

  <text x="1160" y="618" text-anchor="end" fill="#334155" font-size="11">Architecte IA · Environnements Réglementés</text>
