<svg width="1200" height="627" viewBox="0 0 1200 627" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <rect width="1200" height="627" fill="#0f1117"/>
  <rect width="1200" height="4" fill="#f59e0b"/>

  <text x="600" y="68" text-anchor="middle" fill="#ffffff" font-size="36" font-weight="800">Top 5 LLM Budget Leaks</text>
  <text x="600" y="96" text-anchor="middle" fill="#64748b" font-size="16">Found in 100% of audits — no exceptions</text>

  <!-- Row 1 -->
  <rect x="60" y="118" width="1080" height="78" rx="10" fill="#1a1d27"/>
  <rect x="60" y="118" width="6" height="78" rx="3" fill="#ef4444"/>
  <circle cx="108" cy="157" r="22" fill="#ef444420" stroke="#ef4444" stroke-width="2"/>
  <text x="108" y="163" text-anchor="middle" fill="#ef4444" font-size="20" font-weight="800">1</text>
  <text x="148" y="148" fill="#ffffff" font-size="16" font-weight="700">Overloaded system prompt</text>
  <text x="148" y="172" fill="#64748b" font-size="13">Sent on EVERY request. 800 useless tokens × 500K calls/month = $450 wasted. On ONE config line.</text>
  <rect x="970" y="132" width="140" height="50" rx="8" fill="#ef444415"/>
  <text x="1040" y="152" text-anchor="middle" fill="#ef4444" font-size="11" font-weight="600">IMPACT</text>
  <text x="1040" y="172" text-anchor="middle" fill="#ef4444" font-size="18" font-weight="800">−30 to 50%</text>

  <!-- Row 2 -->
  <rect x="60" y="206" width="1080" height="78" rx="10" fill="#1a1d27"/>
  <rect x="60" y="206" width="6" height="78" rx="3" fill="#f97316"/>
  <circle cx="108" cy="245" r="22" fill="#f9731620" stroke="#f97316" stroke-width="2"/>
  <text x="108" y="251" text-anchor="middle" fill="#f97316" font-size="20" font-weight="800">2</text>
  <text x="148" y="236" fill="#ffffff" font-size="16" font-weight="700">Excessive RAG context</text>
  <text x="148" y="260" fill="#64748b" font-size="13">50 chunks instead of 5 → 10x the cost, equal or worse quality (the model drowns in noise).</text>
  <rect x="970" y="220" width="140" height="50" rx="8" fill="#f9731615"/>
  <text x="1040" y="240" text-anchor="middle" fill="#f97316" font-size="11" font-weight="600">IMPACT</text>
  <text x="1040" y="260" text-anchor="middle" fill="#f97316" font-size="18" font-weight="800">−40 to 60%</text>

  <!-- Row 3 -->
  <rect x="60" y="294" width="1080" height="78" rx="10" fill="#1a1d27"/>
  <rect x="60" y="294" width="6" height="78" rx="3" fill="#eab308"/>
  <circle cx="108" cy="333" r="22" fill="#eab30820" stroke="#eab308" stroke-width="2"/>
  <text x="108" y="339" text-anchor="middle" fill="#eab308" font-size="20" font-weight="800">3</text>
  <text x="148" y="324" fill="#ffffff" font-size="16" font-weight="700">Verbose agent reasoning</text>
  <text x="148" y="348" fill="#64748b" font-size="13">The model "thinks out loud". Every intermediate reasoning token is billed. Invisible without traces.</text>
  <rect x="970" y="308" width="140" height="50" rx="8" fill="#eab30815"/>
  <text x="1040" y="328" text-anchor="middle" fill="#eab308" font-size="11" font-weight="600">IMPACT</text>
  <text x="1040" y="348" text-anchor="middle" fill="#eab308" font-size="18" font-weight="800">−20 to 40%</text>

  <!-- Row 4 -->
  <rect x="60" y="382" width="1080" height="78" rx="10" fill="#1a1d27"/>
  <rect x="60" y="382" width="6" height="78" rx="3" fill="#22c55e"/>
  <circle cx="108" cy="421" r="22" fill="#22c55e20" stroke="#22c55e" stroke-width="2"/>
  <text x="108" y="427" text-anchor="middle" fill="#22c55e" font-size="20" font-weight="800">4</text>
  <text x="148" y="412" fill="#ffffff" font-size="16" font-weight="700">Unmanaged conversation history</text>
  <text x="148" y="436" fill="#64748b" font-size="13">Message 50 carries all 49 previous ones. Linear cost growth. Nobody sees it without monitoring.</text>
  <rect x="970" y="396" width="140" height="50" rx="8" fill="#22c55e15"/>
  <text x="1040" y="416" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="600">IMPACT</text>
  <text x="1040" y="436" text-anchor="middle" fill="#22c55e" font-size="18" font-weight="800">variable</text>

  <!-- Row 5 -->
  <rect x="60" y="470" width="1080" height="78" rx="10" fill="#1a1d27"/>
  <rect x="60" y="470" width="6" height="78" rx="3" fill="#6366f1"/>
  <circle cx="108" cy="509" r="22" fill="#6366f120" stroke="#6366f1" stroke-width="2"/>
  <text x="108" y="515" text-anchor="middle" fill="#6366f1" font-size="20" font-weight="800">5</text>
  <text x="148" y="500" fill="#ffffff" font-size="16" font-weight="700">Wrong model for the task</text>
  <text x="148" y="524" fill="#64748b" font-size="13">Up to 200x price gap between Claude Sonnet and Haiku. 80% of banking tasks don't need the premium model.</text>
  <rect x="970" y="484" width="140" height="50" rx="8" fill="#6366f115"/>
  <text x="1040" y="504" text-anchor="middle" fill="#6366f1" font-size="11" font-weight="600">IMPACT</text>
  <text x="1040" y="524" text-anchor="middle" fill="#6366f1" font-size="18" font-weight="800">−50 to 70%</text>

  <!-- Bottom combined -->
  <text x="600" y="590" text-anchor="middle" fill="#f59e0b" font-size="16" font-weight="700">Combined: −70 to 85% on your LLM bill. Effort: Medium. Timeline: 3-4 weeks.</text>

  <text x="1160" y="618" text-anchor="end" fill="#334155" font-size="11">AI Architect · Regulated Environments</text>
</svg>
