<svg width="1200" height="627" viewBox="0 0 1200 627" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <rect width="1200" height="627" fill="#0f1117"/>
  <rect width="1200" height="4" fill="#22c55e"/>

  <!-- Title -->
  <text x="600" y="70" text-anchor="middle" fill="#ffffff" font-size="36" font-weight="800">ROI de l'Observabilité LLM</text>
  <text x="600" y="98" text-anchor="middle" fill="#64748b" font-size="17">Chiffres mesurés en production enterprise</text>

  <!-- Before card -->
  <rect x="60" y="125" width="490" height="350" rx="16" fill="#1a1d27"/>
  <rect x="60" y="125" width="490" height="52" rx="16" fill="#ef444420"/>
  <text x="305" y="158" text-anchor="middle" fill="#ef4444" font-size="18" font-weight="700">SANS OBSERVABILITÉ</text>

  <text x="305" y="215" text-anchor="middle" fill="#94a3b8" font-size="15">Dépense LLM mensuelle</text>
  <text x="305" y="248" text-anchor="middle" fill="#ef4444" font-size="42" font-weight="800">35 000€</text>

  <line x1="100" y1="270" x2="510" y2="270" stroke="#252837" stroke-width="1"/>

  <text x="130" y="300" fill="#64748b" font-size="14">Tokens gaspillés (30%)</text>
  <text x="510" y="300" text-anchor="end" fill="#ef4444" font-size="14" font-weight="600">− 6 000€</text>

  <text x="130" y="328" fill="#64748b" font-size="14">Debug aveugle (20h/sem × 4)</text>
  <text x="510" y="328" text-anchor="end" fill="#ef4444" font-size="14" font-weight="600">− 4 000€</text>

  <text x="130" y="356" fill="#64748b" font-size="14">Incidents non détectés</text>
  <text x="510" y="356" text-anchor="end" fill="#ef4444" font-size="14" font-weight="600">− 5 000€</text>

  <line x1="100" y1="372" x2="510" y2="372" stroke="#334155" stroke-width="1"/>

  <text x="130" y="400" fill="#94a3b8" font-size="15" font-weight="600">Coût évitable total</text>
  <text x="510" y="400" text-anchor="end" fill="#ef4444" font-size="22" font-weight="700">15 000€/mois</text>

  <text x="130" y="435" fill="#64748b" font-size="13">Temps de debug / semaine</text>
  <text x="510" y="435" text-anchor="end" fill="#ef4444" font-size="13" font-weight="600">20h+</text>

  <text x="130" y="458" fill="#64748b" font-size="13">Réponse incident</text>
  <text x="510" y="458" text-anchor="end" fill="#ef4444" font-size="13" font-weight="600">Plusieurs jours</text>

  <!-- After card -->
  <rect x="650" y="125" width="490" height="350" rx="16" fill="#1a1d27"/>
  <rect x="650" y="125" width="490" height="52" rx="16" fill="#22c55e20"/>
  <text x="895" y="158" text-anchor="middle" fill="#22c55e" font-size="18" font-weight="700">AVEC OBSERVABILITÉ LLM</text>

  <text x="895" y="215" text-anchor="middle" fill="#94a3b8" font-size="15">Dépense LLM mensuelle</text>
  <text x="895" y="248" text-anchor="middle" fill="#22c55e" font-size="42" font-weight="800">15 000€</text>

  <line x1="690" y1="270" x2="1100" y2="270" stroke="#252837" stroke-width="1"/>

  <!-- ROI badge -->
  <rect x="750" y="280" width="290" height="70" rx="12" fill="#22c55e15" stroke="#22c55e40" stroke-width="1"/>
  <text x="895" y="308" text-anchor="middle" fill="#22c55e" font-size="13" font-weight="600">RETOUR SUR INVESTISSEMENT</text>
  <text x="895" y="338" text-anchor="middle" fill="#22c55e" font-size="32" font-weight="800">7x à 30x</text>
  <text x="895" y="356" text-anchor="middle" fill="#22c55e" font-size="11">dès le premier mois</text>

  <line x1="690" y1="370" x2="1100" y2="370" stroke="#334155" stroke-width="1"/>

  <text x="720" y="400" fill="#94a3b8" font-size="15" font-weight="600">Économie mensuelle</text>
  <text x="1100" y="400" text-anchor="end" fill="#22c55e" font-size="22" font-weight="700">+ 20 000€/mois</text>

  <text x="720" y="435" fill="#64748b" font-size="13">Temps de debug / semaine</text>
  <text x="1100" y="435" text-anchor="end" fill="#22c55e" font-size="13" font-weight="600">2h</text>

  <text x="720" y="458" fill="#64748b" font-size="13">Réponse incident</text>
  <text x="1100" y="458" text-anchor="end" fill="#22c55e" font-size="13" font-weight="600">Même jour</text>

  <!-- Arrow between -->
  <text x="600" y="320" text-anchor="middle" fill="#6366f1" font-size="32" font-weight="800">→</text>
  <text x="600" y="348" text-anchor="middle" fill="#6366f1" font-size="13" font-weight="600">−57%</text>

  <!-- Formula -->
  <rect x="200" y="498" width="800" height="46" rx="10" fill="#1a1d27" stroke="#334155" stroke-width="1"/>
  <text x="600" y="526" text-anchor="middle" fill="#94a3b8" font-size="14">Économies = (Tokens gaspillés) + (Debug × TJM) + (Incidents évités × Coût)</text>

  <text x="1160" y="618" text-anchor="end" fill="#334155" font-size="11">Architecte IA · Environnements Réglementés</text>
</svg>
