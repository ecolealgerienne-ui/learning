  <rect x="550" y="284" width="580" height="190" rx="8" fill="#0d1117" stroke="#334155" stroke-width="1"/>
  <text x="570" y="306" fill="#6366f1" font-size="12" font-weight="600">model_routing.py — LiteLLM</text>
  <text x="570" y="326" fill="#475569" font-size="12" font-family="monospace">def route_model(task_type, complexity):</text>
  <text x="570" y="344" fill="#94a3b8" font-size="12" font-family="monospace">  if complexity == "simple":</text>
  <text x="570" y="360" fill="#22c55e" font-size="12" font-family="monospace">    return "claude-haiku-4-5"  # 80%</text>
  <text x="570" y="376" fill="#94a3b8" font-size="12" font-family="monospace">  elif task_type in ["audit","legal"]:</text>
  <text x="570" y="392" fill="#f59e0b" font-size="12" font-family="monospace">    return "claude-sonnet-4-6"  # 15%</text>
  <text x="570" y="408" fill="#94a3b8" font-size="12" font-family="monospace">  else:</text>
  <text x="570" y="424" fill="#ef4444" font-size="12" font-family="monospace">    return "claude-opus-4-8"   # 5%</text>
  <text x="570" y="442" fill="#475569" font-size="12" font-family="monospace">  # Auto-traced in Langfuse</text>
  <text x="570" y="460" fill="#475569" font-size="12" font-family="monospace">  # Cost per model visible in real time</text>

  <rect x="550" y="484" width="580" height="44" rx="6" fill="#252837"/>
  <text x="570" y="502" fill="#22c55e" font-size="13" font-weight="700">80% Haiku</text>
  <text x="680" y="502" fill="#475569" font-size="13">·</text>
  <text x="700" y="502" fill="#f59e0b" font-size="13" font-weight="700">15% Sonnet</text>
  <text x="820" y="502" fill="#475569" font-size="13">·</text>
  <text x="840" y="502" fill="#ef4444" font-size="13" font-weight="700">5% Opus</text>
